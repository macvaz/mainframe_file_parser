[project]
name = "formula-engine"
version = "0.1.0"
description = "Parse indicator formulas and evaluate them as Polars expressions"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2.0",
    "polars>=1.29.0",
    "rustworkx>=0.15.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
