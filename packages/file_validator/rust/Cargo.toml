[package]
name = "mainframe_tools"
version = "0.1.0"
edition = "2024"

[lib]
name = "mainframe_tools"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1"
memmap2 = "0.9"
arrow = { version = "54", features = ["prettyprint"] }
parquet = { version = "54", features = ["arrow"] }

