[project]
name = "mainframe-validator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.29.0",
    "pyarrow>=15.0.0",
    "python-cobol>=0.1.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
stubPath = "typings"
include = ["src"]
pythonVersion = "3.12"

# ty only reads pyproject when [tool.ty] is present; align stub search with Pyright.
[tool.ty.environment]
extra-paths = ["typings"]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
markers = [
    "huge: multi-GB fixed file integration (requires pytest --run-huge)",
]

[dependency-groups]
dev = [
    "maturin>=1.13.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

