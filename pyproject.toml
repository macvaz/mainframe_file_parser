[project]
name = "mainframe-validator"
version = "0.1.0"
description = "Monorepo for mainframe file parsing and formula validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "file-validator",
    "formula-engine",
]

[tool.uv.workspace]
members = ["packages/file_validator", "packages/formula_engine"]

[tool.uv.sources]
file-validator = { workspace = true }
formula-engine = { workspace = true }

[tool.pyright]
stubPath = "packages/file_validator/typings"
include = ["packages/file_validator/src", "packages/formula_engine/src", "run.py"]
extraPaths = ["packages/file_validator/src", "packages/formula_engine/src"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"

[tool.ty.environment]
extra-paths = ["packages/file_validator/typings"]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = [
    "packages/file_validator/tests",
    "packages/formula_engine/tests",
]
markers = [
    "huge: multi-GB fixed file integration (requires pytest --run-huge)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
